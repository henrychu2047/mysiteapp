name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable corepack
        run: corepack enable

      - name: Install pnpm if missing
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found, installing pnpm@7"
            npm install -g pnpm@7 || npm install -g pnpm@7 --force
          else
            echo "pnpm already installed, skipping install"
          fi

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next
