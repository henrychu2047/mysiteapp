services:
  mysiteapp:
    image: ghcr.io/henrychu2047/mysiteapp:${MYSITEAPP_IMAGE_TAG:-main}
    container_name: mysiteapp
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      MEMO_POLISH_ALLOWED_ORIGIN: ${MEMO_POLISH_ALLOWED_ORIGIN}
