services:
  mysiteapp:
    image: ghcr.io/henrychu2047/mysiteapp:${MYSITEAPP_IMAGE_TAG:-main}
    pull_policy: always
    container_name: mysiteapp
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      MEMO_POLISH_ALLOWED_ORIGIN: ${MEMO_POLISH_ALLOWED_ORIGIN}
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: >-
        node -e 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
